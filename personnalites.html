<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personnalités & Croyances | Ginoskis</title>
    <link rel="stylesheet" href="styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <nav></nav>
        <section class="hero">
            <h1 class="titres">Grandes Figures</h1>
            <h2 class="subtitle">Découvrez le parcours spirituel et la dénomination des personnalités qui ont marqué le monde chrétien.</h2>
        </section>
    </header>

    <main style="padding: 40px 20px; max-width: 1200px; margin: auto;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
            <div class="container" style="background: white; text-align: center; padding: 20px;">
                <div style="width: 100px; height: 100px; background: #eee; border-radius: 50%; margin: 0 auto 15px;"></div>
                <h3>C.S. Lewis</h3>
                <p style="color: #3e8da8; font-weight: bold;">Anglicanisme</p>
                <p style="font-size: 0.9rem;">Écrivain et apologète célèbre pour "Les Chroniques de Narnia".</p>
            </div>
            <div class="container" style="background: white; text-align: center; padding: 20px;">
                <div style="width: 100px; height: 100px; background: #eee; border-radius: 50%; margin: 0 auto 15px;"></div>
                <h3>Martin Luther King</h3>
                <p style="color: #3e8da8; font-weight: bold;">Baptisme</p>
                <p style="font-size: 0.9rem;">Pasteur et leader des droits civiques aux États-Unis.</p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
