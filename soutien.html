<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soutenez Ginoskis | Ginoskis</title>
    <link rel="stylesheet" href="styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <nav></nav>
        <section class="hero">
            <h1 class="titres">Soutenez Ginoskis</h1>
            <h2 class="subtitle">Aidez-nous à rester indépendants et à développer de nouveaux outils pédagogiques.</h2>
        </section>
    </header>

    <main style="padding: 40px 20px; max-width: 1000px; margin: auto; text-align: center;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
            <div class="container" style="background: white; padding: 30px;">
                <i class='bx bxs-heart' style="font-size: 50px; color: #3e8da8;"></i>
                <h3 style="margin-top: 15px;">Faire un don</h3>
                <p>Soutenez les frais d'hébergement et de recherche du site.</p>
                <button style="background: #3e8da8; color: white; border: none; padding: 12px 25px; margin-top: 20px; border-radius: 5px; cursor: pointer;">Faire un don via PayPal</button>
            </div>
            <div class="container" style="background: white; padding: 30px;">
                <i class='bx bxs-share-alt' style="font-size: 50px; color: #3e8da8;"></i>
                <h3 style="margin-top: 15px;">Partager le projet</h3>
                <p>La meilleure façon de nous aider est de faire connaître Ginoskis autour de vous.</p>
                <div style="margin-top: 20px; font-size: 24px; display: flex; justify-content: center; gap: 15px;">
                    <i class='bx bxl-instagram'></i>
                    <i class='bx bxl-facebook-circle'></i>
                    <i class='bx bxl-twitter'></i>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
